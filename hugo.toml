baseURL = 'https://ryannkyh.github.io'
locale = 'en-us'
title = 'Ryann'
theme = 'rusty-typewriter'

[params.rtwt]
  sidePane = true
  countPageItems = 7

[params.rtwt.home]
  showBio = true
  showAuthorImg = false
  sidePaneTags = true
  showFeatured = true
  showRecent = true
  hideRecentWhenFeatured = true
  countRecent = 5

[params.rtwt.side.home]
  sidePaneSticky = false
  taxonomies = ['tags']
  countTaxonomy = 5

[params.rtwt.side.single]
  sidePaneSticky = true
  showDetails = true
  showTableOfContents = true
  showAttachments = true
  showRelated = true
  countRelated = 5


  languageCode = 'en-US'
  enableRobotsTXT = true

  # rtwt = Rusty Typewriter Theme

  [taxonomies]
  tag = 'tags'
  topic = 'topics'
  series = 'series'

  [params.author]
  name = 'Ryann Alves'

  [[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 1

  [[menus.main]]
  name = 'Projects'
  pageRef = '/projects'
  weight = 2

  [[menus.main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 3

  [[menus.main]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 4

  [[menus.main]]
  name = 'Contacts'
  pageRef = '/contacts'
  weight = 5

  # build search index ================
  [outputFormats]
   [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "searchindex"
    isPlainText = true
    notAlternative = true

  [mediaTypes]
   [mediaTypes."application/json"]
    suffixes = ["json"]

  [outputs]
   home = ["HTML","RSS","SearchIndex"]
  # ===================================

  # GitHub Pages
  [caches]
  [caches.images]
  dir = ':cacheDir/images'
